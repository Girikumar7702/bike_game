
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bike Racing Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111827;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

h1 {
    margin: 15px;
    color: #facc15;
}

#game {
    width: 400px;
    height: 600px;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: #333;
    border: 5px solid white;
    border-radius: 10px;
}

#road {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #333;
}

.line {
    position: absolute;
    width: 8px;
    height: 80px;
    background: white;
    left: 33%;
}

.line:nth-child(2) {
    left: 66%;
}

#player {
    position: absolute;
    width: 45px;
    height: 80px;
    bottom: 20px;
    left: 175px;
    background: #ef4444;
    border: 4px solid #111;
    border-radius: 18px 18px 10px 10px;
    z-index: 5;
}

#player::before {
    content: "";
    position: absolute;
    width: 22px;
    height: 35px;
    background: #fca5a5;
    left: 7px;
    top: 10px;
    border-radius: 10px;
}

.enemy {
    position: absolute;
    width: 45px;
    height: 75px;
    background: #3b82f6;
    border: 4px solid #111;
    border-radius: 15px;
}

#score {
    margin: 10px;
    font-size: 24px;
    color: #facc15;
}

#gameOver {
    display: none;
    position: absolute;
    top: 40%;
    width: 100%;
    background: #111827;
    padding: 20px;
    z-index: 10;
}

button {
    padding: 12px 25px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 18px;
    cursor: pointer;
    margin: 10px;
}

.controls {
    margin: 10px;
}

@media (max-width: 420px) {
    #game {
        width: 95vw;
        height: 75vh;
    }
}
</style>
</head>

<body>

<h1>🏍️ Bike Racing Game</h1>

<div id="score">Score: 0</div>

<div id="game">

    <div id="road">
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div id="player"></div>

    <div id="gameOver">
        <h2>GAME OVER!</h2>
        <p id="finalScore"></p>
        <button onclick="restartGame()">Restart</button>
    </div>

</div>

<div class="controls">
    <button onclick="moveLeft()">⬅ Left</button>
    <button onclick="moveRight()">Right ➡</button>
</div>

<p>Use Arrow Keys or A / D to move</p>

<script>
const game = document.getElementById("game");
const player = document.getElementById("player");
const scoreText = document.getElementById("score");
const gameOver = document.getElementById("gameOver");

let playerX = 175;
let score = 0;
let speed = 5;
let running = true;
let enemies = [];
let lines = [];
let animationId;

// Create road lines
document.querySelectorAll(".line").forEach((line, i) => {
    lines.push({
        element: line,
        y: i * 300
    });
});

function moveLeft() {
    if (running && playerX > 10) {
        playerX -= 40;
        player.style.left = playerX + "px";
    }
}

function moveRight() {
    if (running && playerX < game.clientWidth - 55) {
        playerX += 40;
        player.style.left = playerX + "px";
    }
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {
        moveLeft();
    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {
        moveRight();
    }
});

// Create enemy bikes
function createEnemy() {
    if (!running) return;

    const enemy = document.createElement("div");
    enemy.classList.add("enemy");

    let maxX = game.clientWidth - 55;
    let x = Math.floor(Math.random() * maxX);

    enemy.style.left = x + "px";
    enemy.style.top = "-100px";

    game.appendChild(enemy);

    enemies.push({
        element: enemy,
        x: x,
        y: -100
    });
}

// Collision detection
function collision(a, b) {
    return (
        a.x < b.x + 45 &&
        a.x + 45 > b.x &&
        a.y < b.y + 75 &&
        a.y + 80 > b.y
    );
}

// Main game loop
function gameLoop() {
    if (!running) return;

    // Move road lines
    lines.forEach(line => {
        line.y += speed;

        if (line.y > 600) {
            line.y = -100;
        }

        line.element.style.top = line.y + "px";
    });

    // Move enemy bikes
    enemies.forEach((enemy, index) => {
        enemy.y += speed;

        enemy.element.style.top = enemy.y + "px";

        let playerRect = {
            x: playerX,
            y: game.clientHeight - 100
        };

        if (collision(playerRect, enemy)) {
            endGame();
        }

        if (enemy.y > game.clientHeight) {
            enemy.element.remove();
            enemies.splice(index, 1);

            score++;
            scoreText.innerText = "Score: " + score;

            if (score % 5 === 0) {
                speed++;
            }
        }
    });

    animationId = requestAnimationFrame(gameLoop);
}

// End game
function endGame() {
    running = false;

    cancelAnimationFrame(animationId);

    gameOver.style.display = "block";

    document.getElementById("finalScore").innerText =
        "Your Score: " + score;
}

// Restart game
function restartGame() {
    enemies.forEach(enemy => enemy.element.remove());
    enemies = [];

    playerX = (game.clientWidth - 45) / 2;
    player.style.left = playerX + "px";

    score = 0;
    speed = 5;
    running = true;

    scoreText.innerText = "Score: 0";

    gameOver.style.display = "none";

    gameLoop();
}

// Start game
gameLoop();

// Generate enemy bikes
setInterval(createEnemy, 1500);
</script>

</body>
</html>
